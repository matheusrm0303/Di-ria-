<script type="text/babel">
const{useState,useEffect}=React;

const TIPOS=[
  {tipo:"rua",label:"Diária de Rua",emoji:"🚶",valor:200},
  {tipo:"deposito",label:"Diária de Depósito",emoji:"🏭",valor:100},
  {tipo:"custom",label:"Personalizada",emoji:"💠",valor:0},
];
const SC={
  pendente:{label:"Pendente",cor:"#FACC15",bg:"rgba(250,204,21,.12)"},
  pago:{label:"Pago",cor:"#4ADE80",bg:"rgba(74,222,128,.12)"},
  cancelado:{label:"Cancelado",cor:"#F87171",bg:"rgba(248,113,113,.12)"},
};
const MABR=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const MFULL=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

const fm=v=>(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fd=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return d+"/"+m+"/"+y};
const hoje=()=>new Date().toISOString().slice(0,10);
const nst=s=>String(s||"pendente").toLowerCase().trim();
const num=v=>typeof v==="number"?v:Number(String(v||"0").replace(/[R$\s.]/g,"").replace(",","."))||0;
const calcTotal=d=>num(d.valorDiaria)+num(d.almoco)+num(d.janta);
const pad2=n=>String(n).padStart(2,"0");
const normData=v=>{
  if(!v)return"";
  if(v&&typeof v==="object"&&typeof v.toDate==="function")return v.toDate().toISOString().slice(0,10);
  if(typeof v==="string")return v.slice(0,10);
  if(typeof v==="number")return new Date(v).toISOString().slice(0,10);
  return"";
};

function loadJsPDF(){
  return new Promise(res=>{
    if(window.jspdf){res(window.jspdf.jsPDF);return;}
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>res(window.jspdf.jsPDF);
    document.head.appendChild(s);
  });
}
function abrirBlob(doc,nome){
  try{
    const blob=doc.output("blob");
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=nome;a.target="_blank";
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},2000);
  }catch(e){
    try{
      const uri=doc.output("datauristring");
      const w=window.open("","_blank");
      if(w){w.document.write('<html><body style="margin:0"><iframe src="'+uri+'" style="width:100%;height:100vh;border:none"></iframe></body></html>');w.document.close();}
    }catch(e2){alert("Não foi possível abrir o PDF.");}
  }
}

async function gerarPDFRelatorio(diarias,movimentos,mes){
  const jsPDF=await loadJsPDF();
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210,M=14;let y=14;
  const INK=[9,11,20],AZUL=[14,165,233],VERDE=[74,222,128],AMAR=[250,204,21],CZ=[100,116,139],BR=[255,255,255],CEU=[56,189,248];
  const chk=(n=10)=>{if(y+n>282){doc.addPage();doc.setFillColor(...INK);doc.rect(0,0,W,10,"F");y=18;}};
  const sec=(t,cor)=>{chk(14);doc.setFillColor(...cor);doc.rect(M,y,W-M*2,8,"F");doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...BR);doc.text(t,M+4,y+5.5);y+=12;};
  const dF=diarias.filter(d=>!mes||d.data.slice(0,7)===mes).sort((a,b)=>a.data.localeCompare(b.data));
  const totD2=dF.filter(d=>nst(d.status)!=="cancelado").reduce((s,d)=>s+calcTotal(d),0);
  const totP2=dF.filter(d=>nst(d.status)==="pendente").reduce((s,d)=>s+calcTotal(d),0);
  const totA2=movimentos.reduce((s,m)=>s+num(m.valor),0);
  const saldo2=totP2-totA2;
  doc.setFillColor(...INK);doc.rect(0,0,W,30,"F");
  doc.setFillColor(...AZUL);doc.rect(0,0,5,30,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(17);doc.setTextColor(...BR);doc.text("RELATÓRIO DE DIÁRIAS",M+7,14);
  const periodo=mes?(()=>{const[yr,mo]=mes.split("-");return MFULL[parseInt(mo)-1]+" "+yr;})():"Todos os períodos";
  doc.setFontSize(9);doc.setTextColor(...CZ);doc.text(periodo,M+7,23);doc.text("Gerado: "+new Date().toLocaleDateString("pt-BR"),W-M,23,{align:"right"});
  y=38;
  const cw=(W-M*2-8)/3;
  [[fm(totD2),"Total Diárias",CEU],[fm(totA2),"Adiantamentos",VERDE],[fm(Math.abs(saldo2)),saldo2>=0?"A Receber":"Crédito",saldo2>0?AMAR:VERDE]].forEach(([val,lbl,cor],i)=>{
    const x=M+i*(cw+4);
    doc.setFillColor(18,20,36);doc.roundedRect(x,y,cw,22,2,2,"F");
    doc.setFillColor(...cor);doc.rect(x,y,3,22,"F");
    doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(...CZ);doc.text(lbl.toUpperCase(),x+6,y+8);
    doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(...BR);doc.text(val,x+6,y+17);
  });y+=28;
  sec("DIÁRIAS TRABALHADAS",AZUL);
  const cols=[M,M+26,M+72,M+120,M+148,M+170];
  doc.setFillColor(18,20,36);doc.rect(M,y,W-M*2,7,"F");doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(...CZ);
  ["Data","Evento","Tipo","Total","Status","Obs"].forEach((h,i)=>doc.text(h,cols[i],y+5));y+=8;
  dF.forEach((d,i)=>{
    chk(8);
    doc.setFillColor(i%2===0?14:11,i%2===0?16:14,i%2===0?30:24);doc.rect(M,y-1,W-M*2,7,"F");
    const sc=SC[nst(d.status)]||SC.pendente;
    const tipo=(TIPOS.find(t=>t.tipo===d.tipoDiaria)||{}).label||"Rua";
    doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...BR);
    doc.text(fd(d.data),cols[0],y+4);
    doc.text(String(d.evento||"-").slice(0,20),cols[1],y+4);
    doc.text(tipo.replace("Diária de ",""),cols[2],y+4);
    doc.text(fm(calcTotal(d))+(d.dobra?" ⚡":""),cols[3],y+4);
    const rgb=sc.cor.slice(1);
    doc.setTextColor(parseInt(rgb.slice(0,2),16),parseInt(rgb.slice(2,4),16),parseInt(rgb.slice(4,6),16));
    doc.text(sc.label,cols[4],y+4);
    doc.setTextColor(...BR);doc.text(String(d.obs||"").slice(0,10),cols[5],y+4);
    y+=7;
  });
  if(!dF.length){doc.setFontSize(9);doc.setTextColor(...CZ);doc.text("Nenhuma diária.",M+4,y+5);y+=10;}
  y+=2;doc.setFillColor(...AZUL);doc.rect(M,y,W-M*2,8,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...BR);
  doc.text("TOTAL: "+dF.length+" diárias",M+4,y+5.5);doc.text(fm(totD2),W-M,y+5.5,{align:"right"});
  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFillColor(...INK);doc.rect(0,288,W,9,"F");doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(...CZ);doc.text("Relatório de Diárias",M,294);doc.text("Pág "+i+"/"+pages,W-M,294,{align:"right"});}
  const nome=mes?(()=>{const[yr,mo]=mes.split("-");return"diarias_"+MABR[parseInt(mo)-1]+yr+".pdf";})():"diarias.pdf";
  abrirBlob(doc,nome);
}

function Calendario({calMes,setCalMes,diasSel,setDiasSel,setForm,txt,ac2,mt}){
  const pts=calMes.split("-");
  const ano=Number(pts[0]),mesN=Number(pts[1]);
  const prim=new Date(ano,mesN-1,1).getDay();
  const total=new Date(ano,mesN,0).getDate();
  const cells=[];
  for(let i=0;i<prim;i++)cells.push(null);
  for(let d=1;d<=total;d++)cells.push(d);
  const iso=d=>ano+"-"+pad2(mesN)+"-"+pad2(d);
  const sel=d=>diasSel.includes(iso(d));
  const hj=hoje();
  const tog=d=>{const v=iso(d);setDiasSel(p=>p.includes(v)?p.filter(x=>x!==v):[...p,v].sort());setForm(f=>({...f,data:v}));};
  const prev=()=>{const d=new Date(ano,mesN-2,1);setCalMes(d.getFullYear()+"-"+pad2(d.getMonth()+1));};
  const next=()=>{const d=new Date(ano,mesN,1);setCalMes(d.getFullYear()+"-"+pad2(d.getMonth()+1));};
  return(
    <div style={{marginBottom:14}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <button type="button" className="press" onClick={prev} style={{width:34,height:34,background:"rgba(14,165,233,.08)",border:"1px solid rgba(14,165,233,.15)",borderRadius:8,color:ac2,fontSize:20,display:"flex",alignItems:"center",justifyContent:"center"}}>{"‹"}</button>
        <span style={{fontSize:14,fontWeight:700,color:txt}}>{MFULL[mesN-1]} {ano}</span>
        <button type="button" className="press" onClick={next} style={{width:34,height:34,background:"rgba(14,165,233,.08)",border:"1px solid rgba(14,165,233,.15)",borderRadius:8,color:ac2,fontSize:20,display:"flex",alignItems:"center",justifyContent:"center"}}>{"›"}</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:6}}>
        {["D","S","T","Q","Q","S","S"].map((d,i)=>(
          <div key={i} style={{textAlign:"center",fontSize:10,fontWeight:700,color:mt,paddingBottom:4}}>{d}</div>
        ))}
        {cells.map((d,i)=>(
          d
            ? <button key={i} type="button" className="press" onClick={()=>tog(d)}
                style={{width:"100%",aspectRatio:"1",borderRadius:8,fontSize:13,fontWeight:sel(d)?700:400,
                  border:iso(d)===hj&&!sel(d)?"1.5px solid rgba(14,165,233,.5)":"none",
                  background:sel(d)?"linear-gradient(135deg,#0EA5E9,#0284C7)":"rgba(14,165,233,.06)",
                  color:sel(d)?"#fff":txt,boxShadow:sel(d)?"0 2px 8px rgba(14,165,233,.4)":"none"}}>{d}</button>
            : <div key={i}/>
        ))}
      </div>
      {diasSel.length>0&&(
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"rgba(14,165,233,.08)",border:"1px solid rgba(14,165,233,.2)",borderRadius:10}}>
          <span style={{fontSize:12,color:ac2,fontWeight:600}}>{"📅 "+diasSel.length+" dia"+(diasSel.length>1?"s":"")+" selecionado"+(diasSel.length>1?"s":"")}</span>
          <button type="button" onClick={()=>setDiasSel([])} style={{background:"none",border:"none",color:"#F87171",fontSize:12,fontWeight:600,cursor:"pointer"}}>Limpar</button>
        </div>
      )}
    </div>
  );
}

function App(){
  const auth=window._auth,db=window._db,fb=window._fb;
  const [usuario,setUsuario]=useState(null);
  const [authReady,setAuthReady]=useState(false);
  const [lEmail,setLEmail]=useState("");
  const [lSenha,setLSenha]=useState("");
  const [lMsg,setLMsg]=useState("");
  const [lLoad,setLLoad]=useState(false);
  const [diarias,setDiarias]=useState([]);
  const [movimentos,setMovimentos]=useState([]);
  const [loading,setLoading]=useState(false);
  const [aba,setAba]=useState("diarias");
  const [tela,setTela]=useState("lista");
  const [drawer,setDrawer]=useState(false);
  const [editId,setEditId]=useState(null);
  const [confirmId,setConfirmId]=useState(null);
  const [toast,setToast]=useState(null);
  const [gerando,setGerando]=useState(false);
  const [gerandoF,setGerandoF]=useState(false);
  const [iLog,setILog]=useState("");
  const [iLoading,setILoading]=useState(false);
  const [filtroMes,setFiltroMes]=useState("");
  const [filtroSt,setFiltroSt]=useState("");
  const [busca,setBusca]=useState("");
  const [pdfMes,setPdfMes]=useState("");
  const [form,setForm]=useState({data:hoje(),evento:"",tipoDiaria:"",valorDiaria:"",dobra:false,almoco:"",janta:"",obs:""});
  const [diasSel,setDiasSel]=useState([]);
  const [calMes,setCalMes]=useState(hoje().slice(0,7));
  const [mForm,setMForm]=useState({valor:"",data:hoje(),obs:""});
  const [mErro,setMErro]=useState("");

  const colL=uid=>fb.collection(db,"users",uid,"lancamentos");

  async function carregar(uid){
    setLoading(true);
    try{
      const q=fb.query(colL(uid),fb.orderBy("data","desc"));
      const snap=await fb.getDocs(q);
      const ld=[],lm=[];
      snap.docs.forEach(s=>{
        const d=s.data();
        const data=normData(d.data);
        const cat=String(d.categoria||"diaria").toLowerCase();
        if(cat==="adiantamento"){
          lm.push({id:s.id,tipo:"adiantamento",data,valor:d.valor||0,obs:d.desc||d.obs||""});
        }else{
          ld.push({id:s.id,data,evento:d.desc||d.evento||"",tipoDiaria:d.tipo||d.tipoDiaria||"rua",valorDiaria:d.valor||d.valorDiaria||0,dobra:d.calc==="dobra"||d.dobra||false,almoco:Number(d.almoco)||0,janta:Number(d.janta)||0,obs:d.obs||"",status:String(d.status||"pendente").toLowerCase()});
        }
      });
      setDiarias(ld);setMovimentos(lm);
    }finally{setLoading(false);}
  }

  useEffect(()=>{
    const u=fb.onAuthStateChanged(auth,user=>{
      setUsuario(user||null);setAuthReady(true);
      if(user)carregar(user.uid);else{setDiarias([]);setMovimentos([]);}
    });
    return()=>u();
  },[]);

  async function salvarDiaria(){
    if(!form.evento||!form.tipoDiaria){showToast("Preencha Evento e Tipo.","#F87171");return;}
    const valor=Number(form.valorDiaria)||0;
    if(valor<=0){showToast("Informe o valor.","#F87171");return;}
    const base={evento:form.evento,tipoDiaria:form.tipoDiaria,valorDiaria:valor,dobra:form.dobra||false,almoco:Number(form.almoco)||0,janta:Number(form.janta)||0,obs:form.obs||"",status:"pendente",categoria:"diaria"};
    if(editId){
      const item=diarias.find(d=>d.id===editId);
      await fb.updateDoc(fb.doc(db,"users",usuario.uid,"lancamentos",editId),{...base,data:form.data,status:item?.status||"pendente"});
      showToast("Diária atualizada");
    }else{
      const dias=diasSel.length>0?diasSel:[form.data];
      for(const dia of dias)await fb.addDoc(colL(usuario.uid),{...base,data:dia});
      showToast(dias.length>1?dias.length+" diárias registradas!":"Diária registrada");
    }
    setTela("lista");setEditId(null);resetForm();await carregar(usuario.uid);
  }

  async function marcarPago(id){await fb.updateDoc(fb.doc(db,"users",usuario.uid,"lancamentos",id),{status:"pago"});setDiarias(d=>d.map(x=>x.id===id?{...x,status:"pago"}:x));showToast("Marcada como paga");}
  async function voltarPendente(id){await fb.updateDoc(fb.doc(db,"users",usuario.uid,"lancamentos",id),{status:"pendente"});setDiarias(d=>d.map(x=>x.id===id?{...x,status:"pendente"}:x));showToast("Voltou para pendente","#FACC15");}
  async function excluirDiaria(id){await fb.deleteDoc(fb.doc(db,"users",usuario.uid,"lancamentos",id));setDiarias(d=>d.filter(x=>x.id!==id));setConfirmId(null);if(tela==="form")setTela("lista");showToast("Removida","#F87171");}

  async function salvarMov(){
    const v=num(mForm.valor);
    if(!v||v<=0){setMErro("Informe um valor válido.");return;}
    try{
      await fb.addDoc(colL(usuario.uid),{categoria:"adiantamento",tipo:"adiantamento",valor:v,data:mForm.data,obs:mForm.obs||"",desc:mForm.obs||""});
      setMForm(f=>({...f,valor:"",obs:""}));setMErro("");showToast("Adiantamento registrado");await carregar(usuario.uid);
    }catch(e){setMErro("Erro: "+e.message);}
  }
  async function excluirMov(id){
    try{await fb.deleteDoc(fb.doc(db,"users",usuario.uid,"lancamentos",id));}catch{}
    setMovimentos(m=>m.filter(x=>x.id!==id));showToast("Removido","#F87171");
  }

  async function entrar(){
    if(!lEmail||!lSenha){setLMsg("Preencha e-mail e senha.");return;}
    setLLoad(true);setLMsg("");
    try{await fb.signInWithEmailAndPassword(auth,lEmail,lSenha);}
    catch(e){const m=e.message||"";setLMsg(m.includes("invalid-credential")||m.includes("user-not-found")?"E-mail ou senha incorretos.":m.includes("email-already")?"E-mail já cadastrado.":"Erro ao autenticar.");}
    finally{setLLoad(false);}
  }
  async function cadastrar(){
    if(!lEmail||!lSenha){setLMsg("Preencha e-mail e senha.");return;}
    setLLoad(true);setLMsg("");
    try{await fb.createUserWithEmailAndPassword(auth,lEmail,lSenha);}
    catch(e){const m=e.message||"";setLMsg(m.includes("email-already")?"E-mail já cadastrado.":m.includes("weak-password")?"Senha fraca (mín. 6 caracteres).":"Erro ao criar conta.");}
    finally{setLLoad(false);}
  }

  async function handleImport(e){
    const file=e.target.files?.[0];if(!file)return;
    if(!file.name.toLowerCase().endsWith(".pdf")){showToast("Selecione um PDF.","#F87171");return;}
    setILoading(true);setILog("📖 Lendo PDF...");
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=()=>rej();r.readAsDataURL(file);});
      setILog("🤖 Analisando com IA...");
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:[{type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}},{type:"text",text:"Extraia todas as diárias deste PDF. Retorne APENAS um array JSON com: evento, data (YYYY-MM-DD), tipoDiaria (rua/deposito), valorDiaria (número), almoco (número), janta (número), obs. Se não encontrar nada retorne []."}]}]})});
      const data=await resp.json();
      const txt=data.content.map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
      const itens=JSON.parse(txt);
      if(!itens||!itens.length){setILog("⚠️ Nenhuma diária encontrada.");return;}
      setILog("✅ "+itens.length+" encontrada(s)! Salvando...");
      for(const it of itens)await fb.addDoc(colL(usuario.uid),{categoria:"diaria",data:it.data||hoje(),evento:it.evento||"Importado",tipoDiaria:it.tipoDiaria||"rua",valorDiaria:Number(it.valorDiaria)||0,dobra:false,almoco:Number(it.almoco)||0,janta:Number(it.janta)||0,obs:it.obs||"Importado via PDF",status:"pendente"});
      await carregar(usuario.uid);
      setTimeout(()=>{setTela("lista");setILog("");showToast(itens.length+" diária(s) importada(s)!");},1000);
    }catch(err){setILog("❌ Erro: "+err.message);}
    finally{setILoading(false);e.target.value="";}
  }

  const showToast=(msg,cor="#4ADE80")=>{setToast({msg,cor});setTimeout(()=>setToast(null),2400);};
  const resetForm=()=>{setForm({data:hoje(),evento:"",tipoDiaria:"",valorDiaria:"",dobra:false,almoco:"",janta:"",obs:""});setDiasSel([]);setCalMes(hoje().slice(0,7));};
  const abrirForm=(d=null)=>{
    if(d){setForm({data:d.data,evento:d.evento||"",tipoDiaria:d.tipoDiaria||"",valorDiaria:d.valorDiaria||"",dobra:d.dobra||false,almoco:d.almoco||"",janta:d.janta||"",obs:d.obs||""});setEditId(d.id);setDiasSel([]);setCalMes((d.data||hoje()).slice(0,7));}
    else{resetForm();setEditId(null);}
    setTela("form");
  };

  const totD=diarias.filter(d=>nst(d.status)!=="cancelado").reduce((s,d)=>s+calcTotal(d),0);
  const totP=diarias.filter(d=>nst(d.status)==="pendente").reduce((s,d)=>s+calcTotal(d),0);
  const totA=movimentos.reduce((s,m)=>s+num(m.valor),0);
  const saldo=totP-totA;
  const meses=[...new Set(diarias.map(d=>d.data?.slice(0,7)))].filter(Boolean).sort().reverse();
  const dFilt=diarias.filter(d=>{
    if(filtroMes&&d.data?.slice(0,7)!==filtroMes)return false;
    if(filtroSt&&nst(d.status)!==filtroSt)return false;
    if(busca&&!String(d.evento||"").toLowerCase().includes(busca.toLowerCase()))return false;
    return true;
  }).sort((a,b)=>b.data.localeCompare(a.data));

  const T="#E8F4FD",MT="#3D5A73",AC="#0EA5E9",AC2="#38BDF8";
  const inp={background:"#0A1E35",border:"1px solid rgba(14,165,233,.15)",borderRadius:10,color:T,padding:"13px 15px",fontSize:14,outline:"none",width:"100%"};
  const lbl={color:MT,fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:"1px",display:"block",marginBottom:7};
  const crd={background:"#071628",border:"1px solid rgba(14,165,233,.1)",borderRadius:16};
  const HDR={display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 20px 14px",position:"sticky",top:0,background:"rgba(4,13,26,.96)",backdropFilter:"blur(20px)",zIndex:10,borderBottom:"1px solid rgba(14,165,233,.08)"};

  const Btn=({ch,onClick,style={},disabled=false})=>(
    <button className="press" onClick={onClick} disabled={disabled}
      style={{background:"linear-gradient(135deg,#0EA5E9,#0284C7)",border:"none",borderRadius:12,color:"#fff",fontWeight:700,fontSize:14,padding:"14px 20px",boxShadow:"0 4px 20px rgba(14,165,233,.35)",opacity:disabled?.55:1,...style}}>
      {ch}
    </button>
  );

  if(!authReady)return(
    <div style={{minHeight:"100vh",background:"#040D1A",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{width:32,height:32,border:"2px solid rgba(14,165,233,.2)",borderTop:"2px solid #0EA5E9",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
    </div>
  );

  if(!usuario)return(
    <div style={{minHeight:"100vh",background:"#040D1A",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{...crd,width:"100%",maxWidth:420,padding:28}}>
        <div style={{width:58,height:58,background:"linear-gradient(135deg,#0EA5E9,#0284C7)",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,marginBottom:16}}>💼</div>
        <div style={{fontSize:26,fontWeight:800,color:T,marginBottom:6}}>Controle de Diárias</div>
        <div style={{fontSize:13,color:MT,marginBottom:22,lineHeight:1.5}}>Entre para acessar suas diárias na nuvem.</div>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div><label style={lbl}>E-mail</label><input style={inp} type="email" placeholder="seu@email.com" value={lEmail} onChange={e=>setLEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()}/></div>
          <div><label style={lbl}>Senha</label><input style={inp} type="password" placeholder="••••••" value={lSenha} onChange={e=>setLSenha(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()}/></div>
          {lMsg&&<div style={{fontSize:13,color:"#F87171",background:"rgba(248,113,113,.08)",border:"1px solid rgba(248,113,113,.18)",borderRadius:10,padding:"10px 14px"}}>{lMsg}</div>}
          <Btn ch={lLoad?"Entrando…":"Entrar"} onClick={entrar} disabled={lLoad} style={{width:"100%",marginTop:4}}/>
          <button className="press" onClick={cadastrar} disabled={lLoad} style={{width:"100%",padding:"13px",background:"rgba(14,165,233,.07)",border:"1px solid rgba(14,165,233,.15)",borderRadius:12,color:AC2,fontWeight:600,fontSize:14}}>Criar conta</button>
        </div>
      </div>
    </div>
  );

  const Modal=()=>{
    if(!confirmId)return null;
    const d=diarias.find(x=>x.id===confirmId);
    return(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:60,display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(6px)"}}>
        <div className="fadein" style={{...crd,width:"100%",maxWidth:520,borderRadius:"20px 20px 0 0",padding:24,borderBottom:"none"}}>
          <div style={{width:36,height:4,background:"rgba(14,165,233,.15)",borderRadius:2,margin:"0 auto 20px"}}/>
          <div style={{fontSize:11,fontWeight:700,color:"#F87171",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Confirmar exclusão</div>
          <div style={{fontSize:16,fontWeight:600,color:T,marginBottom:4}}>{d?.evento}</div>
          <div style={{fontSize:13,color:MT,marginBottom:24}}>{fd(d?.data)} · {fm(calcTotal(d||{}))}</div>
          <div style={{display:"flex",gap:10}}>
            <button className="press" style={{flex:1,padding:"13px",background:"#0A1E35",border:"1px solid rgba(14,165,233,.12)",borderRadius:12,color:MT,fontWeight:600,fontSize:14}} onClick={()=>setConfirmId(null)}>Cancelar</button>
            <button className="press" style={{flex:1,padding:"13px",background:"rgba(248,113,113,.1)",border:"1px solid rgba(248,113,113,.2)",borderRadius:12,color:"#F87171",fontWeight:700,fontSize:14}} onClick={()=>excluirDiaria(confirmId)}>Excluir</button>
          </div>
        </div>
      </div>
    );
  };

  if(tela==="importar")return(
    <div style={{minHeight:"100vh",background:"#040D1A",color:T,maxWidth:520,margin:"0 auto"}}>
      <div style={HDR}>
        <button className="press" onClick={()=>{setTela("lista");setILog("");}} style={{background:"transparent",border:"1px solid rgba(14,165,233,.12)",color:MT,fontSize:13,fontWeight:500,padding:"8px 16px",borderRadius:20}}>{"← Voltar"}</button>
        <span style={{fontSize:16,fontWeight:700}}>Importar PDF</span>
        <div style={{width:80}}/>
      </div>
      <div style={{padding:"24px 20px",display:"flex",flexDirection:"column",gap:16}}>
        <div style={{textAlign:"center"}}>
          <div style={{width:64,height:64,background:"linear-gradient(135deg,#0EA5E9,#0284C7)",borderRadius:18,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,margin:"0 auto 14px"}}>🤖</div>
          <div style={{fontSize:20,fontWeight:800,color:T}}>Importar diárias</div>
          <div style={{color:MT,fontSize:13,marginTop:6,lineHeight:1.6}}>Envie um PDF e a IA extrai os dados automaticamente.</div>
        </div>
        <div style={{...crd,padding:18}}>
          <label style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10,padding:"28px 20px",background:"rgba(14,165,233,.04)",border:"2px dashed rgba(14,165,233,.2)",borderRadius:12,cursor:"pointer",textAlign:"center"}}>
            <span style={{fontSize:36}}>📄</span>
            <span style={{color:AC2,fontWeight:600,fontSize:14}}>Toque para selecionar</span>
            <span style={{color:MT,fontSize:12}}>Arquivos .pdf</span>
            <input type="file" accept=".pdf,application/pdf" style={{display:"none"}} onChange={handleImport}/>
          </label>
        </div>
        {(iLoading||iLog)&&(
          <div style={{...crd,padding:16,display:"flex",alignItems:"center",gap:12}}>
            {iLoading&&<div style={{width:20,height:20,border:"2px solid rgba(14,165,233,.2)",borderTop:"2px solid #0EA5E9",borderRadius:"50%",animation:"spin 1s linear infinite",flexShrink:0}}/>}
            <span style={{fontSize:13,color:iLog.startsWith("❌")?"#F87171":iLog.startsWith("✅")?AC2:MT,fontWeight:500}}>{iLog||"Processando…"}</span>
          </div>
        )}
      </div>
    </div>
  );

  if(tela==="pdf")return(
    <div style={{minHeight:"100vh",background:"#040D1A",color:T,maxWidth:520,margin:"0 auto"}}>
      <div style={HDR}>
        <button className="press" onClick={()=>setTela("lista")} style={{background:"transparent",border:"1px solid rgba(14,165,233,.12)",color:MT,fontSize:13,fontWeight:500,padding:"8px 16px",borderRadius:20}}>{"← Voltar"}</button>
        <span style={{fontSize:16,fontWeight:700}}>Exportar PDF</span>
        <div style={{width:80}}/>
      </div>
      <div style={{padding:"24px 20px",display:"flex",flexDirection:"column",gap:16}}>
        <div style={{...crd,padding:18}}>
          <label style={lbl}>Filtrar por mês</label>
          <select style={inp} value={pdfMes} onChange={e=>setPdfMes(e.target.value)}>
            <option value="">Todos os períodos</option>
            {meses.map(m=>{const[y,mo]=m.split("-");return <option key={m} value={m}>{MFULL[parseInt(mo)-1]} {y}</option>;})}
          </select>
        </div>
        <Btn ch={gerando?"Gerando…":"↓ Baixar PDF"} onClick={async()=>{setGerando(true);try{await gerarPDFRelatorio(diarias,movimentos,pdfMes);}catch(e){alert("Erro: "+e.message);}finally{setGerando(false);setTela("lista");}}} disabled={gerando} style={{width:"100%",padding:15}}/>
      </div>
    </div>
  );

  if(tela==="form")return(
    <div style={{minHeight:"100vh",background:"#040D1A",color:T,maxWidth:520,margin:"0 auto"}}>
      <div style={HDR}>
        <button className="press" onClick={()=>setTela("lista")} style={{background:"transparent",border:"1px solid rgba(14,165,233,.12)",color:MT,fontSize:13,fontWeight:500,padding:"8px 16px",borderRadius:20}}>{"← Voltar"}</button>
        <span style={{fontSize:16,fontWeight:700}}>{editId?"Editar Diária":"Nova Diária"}</span>
        <div style={{width:80}}/>
      </div>
      <div style={{padding:"20px 20px 120px",display:"flex",flexDirection:"column",gap:14}} className="fadein">
        <div style={{...crd,padding:18}}>
          {!editId
            ? <Calendario calMes={calMes} setCalMes={setCalMes} diasSel={diasSel} setDiasSel={setDiasSel} setForm={setForm} txt={T} ac2={AC2} mt={MT}/>
            : <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
                <div><label style={lbl}>Data</label><input type="date" style={inp} value={form.data} onChange={e=>setForm(f=>({...f,data:e.target.value}))}/></div>
                <div><label style={lbl}>Dia</label><div style={{...inp,color:AC2,fontWeight:600,background:"rgba(14,165,233,.06)",border:"1px solid rgba(14,165,233,.15)"}}>{form.data?new Date(form.data+"T12:00").toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","").replace(/^\w/,c=>c.toUpperCase()):"—"}</div></div>
              </div>
          }
          <div><label style={lbl}>Evento *</label><input style={inp} placeholder="Ex: Show do João…" value={form.evento} onChange={e=>setForm(f=>({...f,evento:e.target.value}))}/></div>
        </div>
        <div style={{...crd,padding:18}}>
          <label style={lbl}>Tipo de Diária *</label>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:10}}>
            {TIPOS.map(op=>{
              const sl=form.tipoDiaria===op.tipo;
              return(
                <button key={op.tipo} type="button" className="press"
                  onClick={()=>setForm(f=>({...f,tipoDiaria:op.tipo,valorDiaria:op.tipo==="custom"?(f.valorDiaria||""):(f.dobra?op.valor*2:op.valor)}))}

        <div style={{margin:"16px 16px 0",borderRadius:20,background:"linear-gradient(145deg,#040D1A,#071E38)",border:"1px solid rgba(74,222,128,.2)",overflow:"hidden"}}>
          <div style={{padding:"22px 22px 20px"}}>
            <div style={{fontSize:11,fontWeight:600,color:"rgba(74,222,128,.5)",textTransform:"uppercase",letterSpacing:"1.2px",marginBottom:8}}>{saldo>0?"A Receber":saldo<0?"Crédito":"Quitado"}</div>
            <div style={{fontSize:36,fontWeight:800,letterSpacing:"-.04em",lineHeight:1,color:saldo>0?"#4ADE80":saldo<0?"#F87171":"#4ADE80"}}>{saldo<0?"+ ":""}{fm(Math.abs(saldo))}</div>
            <div style={{fontSize:12,color:MT,marginTop:6}}>{diarias.length} diárias · {fm(totA)} adiantado · total {fm(totD)}</div>
            {totD>0&&(
              <div style={{marginTop:16}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                  <span style={{fontSize:11,color:MT,fontWeight:600}}>Progresso de recebimento</span>
                  <span style={{fontSize:11,fontWeight:700,color:pct>=100?"#4ADE80":AC2}}>{pct}%</span>
                </div>
                <div style={{height:10,borderRadius:99,background:"rgba(14,165,233,.1)",overflow:"hidden",display:"flex"}}>
                  <div style={{width:pA+"%",background:"linear-gradient(90deg,#0EA5E9,#38BDF8)",transition:"width .6s"}}/>
                  <div style={{width:pP+"%",background:"linear-gradient(90deg,#22C55E,#4ADE80)",transition:"width .6s"}}/>
                </div>
                <div style={{display:"flex",gap:14,marginTop:8}}>
                  {[["#38BDF8","Adiantado",fm(totA)],["#4ADE80","Pago",fm(totPago)],["rgba(14,165,233,.2)","Pendente",fm(totPend)]].map(([cor,l,v])=>(
                    <div key={l} style={{display:"flex",alignItems:"center",gap:5}}>
                      <div style={{width:8,height:8,borderRadius:"50%",background:cor,flexShrink:0}}/>
                      <span style={{fontSize:10,color:MT}}>{l} {v}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:16}}>
              <button className="press" onClick={()=>setWaModal(true)} style={{background:"linear-gradient(135deg,#15803D,#16A34A)",border:"1px solid rgba(74,222,128,.25)",borderRadius:10,color:"#4ADE80",padding:"13px",fontWeight:700,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>💬 WhatsApp</button>
              <button className="press" onClick={async()=>{setGerandoF(true);try{await gerarPDFFechamento(diarias,movimentos);}catch(e){alert("Erro: "+e.message);}finally{setGerandoF(false);}}} disabled={gerandoF}
                style={{background:"linear-gradient(135deg,#064E3B,#047857)",border:"1px solid rgba(34,211,238,.25)",borderRadius:10,color:"#22D3EE",padding:"13px",fontWeight:700,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:7,opacity:gerandoF?.6:1}}>
                📄 {gerandoF?"Gerando…":"PDF"}
              </button>
            </div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,padding:"12px 16px 0"}}>
          {[["📋","Total",fm(totD),T],["⏳","Pendente",fm(totPend),"#FACC15"],["✅","Pagas",fm(totPago),"#4ADE80"],["💵","Adiantado",fm(totA),"#38BDF8"]].map(([icon,l,v,c])=>(
            <div key={l} style={{...crd,padding:"13px 14px",display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:34,height:34,background:"rgba(14,165,233,.07)",border:"1px solid rgba(14,165,233,.1)",borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>{icon}</div>
              <div>
                <div style={{fontSize:10,color:MT,fontWeight:600,textTransform:"uppercase",letterSpacing:"1px"}}>{l}</div>
                <div style={{fontSize:14,fontWeight:800,color:c,marginTop:2}}>{v}</div>
              </div>
            </div>
          ))}
        </div>
        {totD>0&&(
          <div style={{padding:"12px 16px 0"}}>
            <div style={{...crd,padding:18}}>
              <div style={{fontSize:11,fontWeight:700,color:MT,textTransform:"uppercase",letterSpacing:"1px",marginBottom:14}}>Distribuição</div>
              <div style={{display:"flex",alignItems:"center",gap:20}}>
                <div style={{position:"relative",width:88,height:88,flexShrink:0}}>
                  <svg viewBox="0 0 36 36" style={{width:88,height:88,transform:"rotate(-90deg)"}}>
                    <circle cx="18" cy="18" r="15.9" fill="none" stroke="rgba(14,165,233,.1)" strokeWidth="3.5"/>
                    <circle cx="18" cy="18" r="15.9" fill="none" stroke="#FACC15" strokeWidth="3.5" strokeDasharray={(totPend/totD*100)+" "+(100-totPend/totD*100)} strokeDashoffset="0"/>
                    <circle cx="18" cy="18" r="15.9" fill="none" stroke="#38BDF8" strokeWidth="3.5" strokeDasharray={(totA/totD*100)+" "+(100-totA/totD*100)} strokeDashoffset={-(totPend/totD*100)+""}/>
                    <circle cx="18" cy="18" r="15.9" fill="none" stroke="#4ADE80" strokeWidth="3.5" strokeDasharray={(totPago/totD*100)+" "+(100-totPago/totD*100)} strokeDashoffset={-((totPend+totA)/totD*100)+""}/>
                  </svg>
                  <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                    <div style={{fontSize:15,fontWeight:800,color:pct>=100?"#4ADE80":AC2}}>{pct}%</div>
                    <div style={{fontSize:8,color:MT}}>recebido</div>
                  </div>
                </div>
                <div style={{flex:1,display:"flex",flexDirection:"column",gap:10}}>
                  {[["Pendente",totPend,totD,"#FACC15"],["Adiantado",totA,totD,"#38BDF8"],["Pago",totPago,totD,"#4ADE80"]].map(([l,v,tt,cor])=>(
                    <div key={l}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                        <span style={{fontSize:10,color:MT,fontWeight:600}}>{l}</span>
                        <span style={{fontSize:10,fontWeight:700,color:cor}}>{tt>0?Math.round(v/tt*100):0}%</span>
                      </div>
                      <div style={{height:5,borderRadius:99,background:"rgba(14,165,233,.08)"}}>
                        <div style={{height:"100%",borderRadius:99,width:(tt>0?Math.min(100,v/tt*100):0)+"%",background:cor,transition:"width .6s"}}/>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}
        {dPend.length>0&&(
          <div style={{padding:"12px 16px 0"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#FACC15",textTransform:"uppercase",letterSpacing:"1px",marginBottom:10}}>⏳ Pendentes</div>
            {dPend.slice().sort((a,b)=>a.data.localeCompare(b.data)).map(d=>{
              const ti=TIPOS.find(t=>t.tipo===d.tipoDiaria);
              return(
                <div key={d.id} style={{...crd,marginBottom:8,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:T,marginBottom:3}}>{d.evento}{d.dobra&&<span style={{color:AC2,fontSize:11}}> ⚡</span>}</div>
                    <div style={{fontSize:11,color:MT}}>{fd(d.data)}{ti?" · "+ti.emoji+" "+ti.label:""}</div>
                  </div>
                  <div style={{fontSize:15,fontWeight:800,color:"#FACC15"}}>{fm(calcTotal(d))}</div>
                </div>
              );
            })}
          </div>
        )}
        {totA>0&&(
          <div style={{padding:"12px 16px 0"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#38BDF8",textTransform:"uppercase",letterSpacing:"1px",marginBottom:10}}>💵 Adiantamentos</div>
            {[...movimentos].sort((a,b)=>b.data.localeCompare(a.data)).map(m=>(
              <div key={m.id} style={{...crd,marginBottom:8,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:13,fontWeight:600,color:"#38BDF8",marginBottom:3}}>💵 Adiantamento</div>
                  <div style={{fontSize:11,color:MT}}>{fd(m.data)}{m.obs?" · "+m.obs:""}</div>
                </div>
                <div style={{fontSize:15,fontWeight:800,color:AC2}}>{fm(m.valor)}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  return(
    <div style={{minHeight:"100vh",background:"#040D1A",color:T,maxWidth:520,margin:"0 auto"}}>
      {drawer&&<div onClick={()=>setDrawer(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:40,backdropFilter:"blur(4px)"}}/>}
      <div style={{position:"fixed",top:0,left:0,height:"100%",width:272,background:"#040D1A",borderRight:"1px solid rgba(14,165,233,.1)",zIndex:50,transform:drawer?"translateX(0)":"translateX(-100%)",transition:"transform .28s cubic-bezier(.4,0,.2,1)",display:"flex",flexDirection:"column"}}>
        <div style={{padding:"22px 20px 16px",borderBottom:"1px solid rgba(14,165,233,.07)"}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:40,height:40,background:"linear-gradient(135deg,#0EA5E9,#0284C7)",borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>💼</div>
            <div><div style={{fontSize:15,fontWeight:800,color:T}}>Controle</div><div style={{fontSize:11,color:MT,marginTop:1}}>{usuario?.email||""}</div></div>
          </div>
        </div>
        <div style={{flex:1,padding:"12px",display:"flex",flexDirection:"column",gap:3}}>
          {[{id:"diarias",icon:"📋",label:"Diárias",sub:"Dias trabalhados"},{id:"adiantamento",icon:"💵",label:"Adiantamento",sub:"Recebimentos parciais"},{id:"fechamento",icon:"🔒",label:"Fechamento",sub:"Resumo completo"}].map(t=>{
            const on=aba===t.id;
            return(
              <button key={t.id} className="press" onClick={()=>{setAba(t.id);setDrawer(false);}}
                style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:13,border:"none",cursor:"pointer",background:on?"rgba(14,165,233,.12)":"transparent",textAlign:"left",width:"100%"}}>
                <div style={{width:36,height:36,background:on?"rgba(14,165,233,.2)":"rgba(14,165,233,.06)",border:"1px solid "+(on?"rgba(14,165,233,.3)":"rgba(14,165,233,.1)"),borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{t.icon}</div>
                <div><div style={{fontSize:13,fontWeight:on?700:500,color:on?T:MT}}>{t.label}</div><div style={{fontSize:11,color:MT,marginTop:1,opacity:.7}}>{t.sub}</div></div>
                {on&&<div style={{marginLeft:"auto",width:6,height:6,borderRadius:"50%",background:AC2,flexShrink:0}}/>}
              </button>
            );
          })}
          <div style={{height:1,background:"rgba(14,165,233,.07)",margin:"8px 0"}}/>
          {[{icon:"📊",label:"Exportar PDF",sub:"Relatório",action:()=>{setTela("pdf");setDrawer(false);}},{icon:"📥",label:"Importar PDF",sub:"Extrair com IA",action:()=>{setTela("importar");setDrawer(false);}}].map(t=>(
            <button key={t.label} className="press" onClick={t.action}
              style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:13,border:"none",cursor:"pointer",background:"transparent",textAlign:"left",width:"100%"}}>
              <div style={{width:36,height:36,background:"rgba(14,165,233,.06)",border:"1px solid rgba(14,165,233,.1)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{t.icon}</div>
              <div><div style={{fontSize:13,fontWeight:500,color:MT}}>{t.label}</div><div style={{fontSize:11,color:MT,marginTop:1,opacity:.7}}>{t.sub}</div></div>
            </button>
          ))}
        </div>
        <div style={{padding:"12px",borderTop:"1px solid rgba(14,165,233,.07)",paddingBottom:"calc(12px + env(safe-area-inset-bottom))"}}>
          <button className="press" onClick={()=>{fb.signOut(auth);setDrawer(false);}}
            style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:13,border:"none",cursor:"pointer",background:"rgba(248,113,113,.06)",textAlign:"left",width:"100%"}}>
            <div style={{width:36,height:36,background:"rgba(248,113,113,.08)",border:"1px solid rgba(248,113,113,.12)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>🚪</div>
            <div style={{fontSize:13,fontWeight:600,color:"#F87171"}}>Sair da conta</div>
          </button>
        </div>
      </div>
      <div style={HDR}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button className="press" onClick={()=>setDrawer(true)} style={{width:40,height:40,background:"rgba(14,165,233,.07)",border:"1px solid rgba(14,165,233,.15)",borderRadius:11,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:5,cursor:"pointer",flexShrink:0}}>
            <div style={{width:18,height:2,background:AC2,borderRadius:2}}/>
            <div style={{width:13,height:2,background:AC2,borderRadius:2}}/>
            <div style={{width:18,height:2,background:AC2,borderRadius:2}}/>
          </button>
          <div>
            <div style={{fontSize:18,fontWeight:800,color:T,letterSpacing:"-.03em"}}>{aba==="diarias"?"Diárias":aba==="adiantamento"?"Adiantamento":"Fechamento"}</div>
            <div style={{fontSize:11,color:MT,marginTop:1}}>{aba==="diarias"?"Dias trabalhados":aba==="adiantamento"?"Recebimentos parciais":"Resumo completo"}</div>
          </div>
        </div>
        {aba==="diarias"&&(
          <button className="press" onClick={()=>abrirForm()} style={{background:"linear-gradient(135deg,#0EA5E9,#0284C7)",border:"none",borderRadius:11,color:"#fff",fontWeight:700,fontSize:13,padding:"10px 16px",boxShadow:"0 4px 16px rgba(14,165,233,.35)"}}>+ Nova</button>
        )}
      </div>
      {aba==="diarias"&&renderDiarias()}
      {aba==="adiantamento"&&renderAdiant()}
      {aba==="fechamento"&&renderFechamento()}
      {aba==="diarias"&&(
        <button className="press" onClick={()=>abrirForm()} style={{position:"fixed",bottom:24,right:"max(20px,calc(50vw - 240px))",zIndex:30,width:56,height:56,borderRadius:"50%",border:"none",cursor:"pointer",background:"linear-gradient(135deg,#0EA5E9,#0284C7)",boxShadow:"0 6px 28px rgba(14,165,233,.5)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,color:"#fff",fontWeight:700}}>+</button>
      )}
      {toast&&(
        <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#071628",border:"1px solid "+toast.cor+"30",color:toast.cor,padding:"10px 20px",borderRadius:50,fontSize:13,fontWeight:600,boxShadow:"0 8px 32px rgba(0,0,0,.6)",zIndex:100,whiteSpace:"nowrap",backdropFilter:"blur(12px)"}}>{toast.msg}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
