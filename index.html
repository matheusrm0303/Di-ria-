  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icone.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body, #root { min-height: 100%; margin: 0; padding: 0; }
    body { background: #040D1A; font-family: 'Inter', Arial, sans-serif; }
    button, input, select, textarea { font-family: 'Inter', Arial, sans-serif; }

    .fadein { animation: fi .3s ease; }
    @keyframes fi { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

<body>
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, getDocs, doc,
      updateDoc, deleteDoc, query, orderBy
    } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAYcIFdxFPJyVl2im8Zyps5MGF7pupe_NI",
      authDomain: "controle-diarias-4627b.firebaseapp.com",
      projectId: "controle-diarias-4627b",
      storageBucket: "controle-diarias-4627b.firebasestorage.app",
      messagingSenderId: "432274053982",
      appId: "1:432274053982:web:31a14aeb0e4f4517e40dcf"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth        = getAuth(firebaseApp);
    const db          = getFirestore(firebaseApp);

    // Expõe para o React (módulos separados não compartilham escopo)
    window.__firebaseAuth = auth;
    window.__firebaseDb   = db;
    window.__firebaseFns  = {
      createUserWithEmailAndPassword, signInWithEmailAndPassword,

      collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── constantes ────────────────────────────────────────────────────────
    const MESES      = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
    const MESES_FULL = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

    const TIPOS = [
      { tipo:"rua",          label:"Diária de Rua",      emoji:"🚶", valor:200 },
      { tipo:"deposito",     label:"Diária de Depósito", emoji:"🏭", valor:100 },
      { tipo:"personalizada",label:"Personalizada",      emoji:"💠", valor:0   },
    ];

    const SC = {
      pendente:  { label:"Pendente",  cor:"#FACC15", bg:"rgba(250,204,21,.1)"  },
      pago:      { label:"Pago",      cor:"#22D3EE", bg:"rgba(34,211,238,.1)"  },
      cancelado: { label:"Cancelado", cor:"#F87171", bg:"rgba(248,113,113,.1)" },
    };

    // ── utilitários ───────────────────────────────────────────────────────
    function fm(v)  { return (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
    function fd(iso){ if(!iso)return""; const[y,m,d]=iso.split("-"); return`${d}/${m}/${y}`; }
    function hoje() { return new Date().toISOString().slice(0,10); }
    function num(v) {
      if(typeof v==="number") return v||0;
      return Number(String(v||"0").replace(/[R$\s.]/g,"").replace(",","."))||0;
    }
    function calcTotal(d) { return num(d.valorDiaria)+num(d.almoco)+num(d.janta); }

    // ── PDF ───────────────────────────────────────────────────────────────
    function loadJsPDF(){
      return new Promise(res=>{
        if(window.jspdf){res(window.jspdf.jsPDF);return;}
        const s=document.createElement("script");
        s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
        s.onload=()=>res(window.jspdf.jsPDF);
        document.head.appendChild(s);
      });
    }

    function abrirBlob(doc,nome){
      try{
        const blob=doc.output("blob");
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;a.download=nome;a.target="_blank";
        document.body.appendChild(a);a.click();
        setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},2000);
      }catch(e){
        try{
          const uri=doc.output("datauristring");
          const win=window.open("","_blank");
          if(win){win.document.write('<html><head><title>'+nome+'</title></head><body style="margin:0"><iframe src="'+uri+'" style="width:100%;height:100vh;border:none"></iframe></body></html>');win.document.close();}
          else{const a=document.createElement("a");a.href=doc.output("datauristring");a.download=nome;document.body.appendChild(a);a.click();document.body.removeChild(a);}
        }catch(e2){alert("Não foi possível abrir o PDF: "+e2.message);}
      }
    }

    async function exportPDF(diarias,movimentos,mes){
      const jsPDF=await loadJsPDF();
      const doc=new jsPDF({unit:"mm",format:"a4"});
      const W=210,M=14;let y=0;
      const INK=[9,11,20],PUR=[14,165,233],MINT=[74,222,128],YEL=[250,204,21],
            GRAY=[100,116,139],WHITE=[255,255,255],SKY=[56,189,248];
      const chk=(n=10)=>{if(y+n>282){doc.addPage();doc.setFillColor(...INK);doc.rect(0,0,W,10,"F");y=18;}};
      const sec=(txt2,cor)=>{chk(14);doc.setFillColor(...cor);doc.rect(M,y,W-M*2,8,"F");doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...WHITE);doc.text(txt2,M+4,y+5.5);y+=12;};
      const dF=diarias.filter(d=>!mes||d.data?.slice(0,7)===mes).sort((a,b)=>a.data.localeCompare(b.data));
      const totD=dF.filter(d=>d.status!=="cancelado").reduce((s,d)=>s+calcTotal(d),0);
      const totP=dF.filter(d=>d.status==="pendente").reduce((s,d)=>s+calcTotal(d),0);
      const totA=movimentos.filter(m=>m.tipo==="adiantamento").reduce((s,m)=>s+num(m.valor),0);
      const saldo=totP-totA;
      doc.setFillColor(...INK);doc.rect(0,0,W,30,"F");
      doc.setFillColor(...PUR);doc.rect(0,0,5,30,"F");
      doc.setFont("helvetica","bold");doc.setFontSize(17);doc.setTextColor(...WHITE);
      doc.text("RELATÓRIO DE DIÁRIAS",M+7,14);
      const periodo=mes?(()=>{const[yr,mo]=mes.split("-");return MESES_FULL[parseInt(mo)-1]+" "+yr;})():"Todos os períodos";
      doc.setFontSize(9);doc.setTextColor(...GRAY);
      doc.text(periodo,M+7,23);doc.text("Gerado: "+new Date().toLocaleDateString("pt-BR"),W-M,23,{align:"right"});
      y=38;
      const cw=(W-M*2-8)/3;
      [[fm(totD),"Total em Diárias",SKY],[fm(totA),"Adiantamentos",MINT],[fm(saldo),"Saldo Pendente",saldo>0?YEL:MINT]].forEach((item,i)=>{
        const [val,lbl,cor]=item,x=M+i*(cw+4);
        doc.setFillColor(18,20,36);doc.roundedRect(x,y,cw,22,2,2,"F");
        doc.setFillColor(...cor);doc.rect(x,y,3,22,"F");
        doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(...GRAY);doc.text(lbl.toUpperCase(),x+6,y+8);
        doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(...WHITE);doc.text(val,x+6,y+17);
      });y+=28;
      sec("DIÁRIAS TRABALHADAS",PUR);
      const cols=[M,M+26,M+74,M+114,M+144,M+170];
      const thd=()=>{doc.setFillColor(18,20,36);doc.rect(M,y,W-M*2,7,"F");doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(...GRAY);["Data","Evento","Tipo","Total","Status","Obs"].forEach((h,i)=>doc.text(h,cols[i],y+5));y+=8;};
      thd();
      dF.forEach((d,i)=>{
        chk(8);
        doc.setFillColor(i%2===0?14:11,i%2===0?16:14,i%2===0?30:24);doc.rect(M,y-1,W-M*2,7,"F");
        const sc2=SC[d.status]||SC.pendente;
        const tipo=(TIPOS.find(t=>t.tipo===d.tipoDiaria)||{}).label||"-";
        doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...WHITE);
        doc.text(fd(d.data),cols[0],y+4);
        doc.text((d.evento||d.desc||"-").slice(0,20),cols[1],y+4);
        doc.text(tipo.replace("Diária de ",""),cols[2],y+4);
        doc.text(fm(calcTotal(d))+(d.dobra?" ⚡":""),cols[3],y+4);
        const rgb2=sc2.cor.slice(1);
        doc.setTextColor(parseInt(rgb2.slice(0,2),16),parseInt(rgb2.slice(2,4),16),parseInt(rgb2.slice(4,6),16));
        doc.text(sc2.label,cols[4],y+4);
        doc.setTextColor(...WHITE);doc.text((d.obs||"").slice(0,12),cols[5],y+4);
        y+=7;
      });
      if(!dF.length){doc.setFontSize(9);doc.setTextColor(...GRAY);doc.text("Nenhuma diária no período.",M+4,y+5);y+=10;}
      y+=2;doc.setFillColor(...PUR);doc.rect(M,y,W-M*2,8,"F");
      doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...WHITE);
      doc.text("TOTAL",cols[0],y+5.5);doc.text(dF.length+" diárias",cols[2],y+5.5);doc.text(fm(totD),cols[3],y+5.5);y+=14;
      const nome=mes?(()=>{const pts=mes.split("-");return"diarias_"+MESES[parseInt(pts[1])-1]+pts[0]+".pdf";})():"diarias.pdf";
      abrirBlob(doc,nome);
    }

    async function exportPDFFechamento(diarias,movimentos){
      const jsPDF=await loadJsPDF();
      const doc=new jsPDF({unit:"mm",format:"a4"});
      const W=210,M=14;let y=14;
      const INK=[9,11,20],PUR=[14,165,233],MINT=[74,222,128],YEL=[250,204,21],
            GRAY=[100,116,139],WHITE=[255,255,255],SKY=[56,189,248];

      // garante string segura para comparação
      function ds(d){ return String(d||""); }

      const chk=(n=10)=>{
        if(y+n>282){
          // rodapé antes de virar página
          doc.setFillColor(...INK);doc.rect(0,288,W,9,"F");
          doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(...GRAY);
          doc.text("Fechamento · Relatório de Diárias",M,294);
          doc.addPage();
          y=14;
        }
      };

      const sec=(titulo,cor)=>{
        chk(14);
        doc.setFillColor(...cor);doc.rect(M,y,W-M*2,8,"F");
        doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...WHITE);
        doc.text(titulo,M+4,y+5.5);
        y+=12;
      };

      const nst=s=>String(s||"pendente").toLowerCase().trim();const dPend=diarias.filter(d=>nst(d.status)==="pendente");
      const dPagas=diarias.filter(d=>nst(d.status)==="pago");
      const totD=diarias.filter(d=>nst(d.status)!=="cancelado").reduce((s,d)=>s+calcTotal(d),0);
      const totA   = movimentos.filter(m=>m.tipo==="adiantamento").reduce((s,m)=>s+num(m.valor),0);
      const totPend= dPend.reduce((s,d)=>s+calcTotal(d),0);
      const totPago= dPagas.reduce((s,d)=>s+calcTotal(d),0);
      const saldo  = totPend-totA;

      // ── Cabeçalho ──
      doc.setFillColor(...INK);doc.rect(0,0,W,32,"F");
      doc.setFillColor(...MINT);doc.rect(0,0,5,32,"F");
      doc.setFont("helvetica","bold");doc.setFontSize(18);doc.setTextColor(...WHITE);
      doc.text("FECHAMENTO",M+7,15);
      doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(...MINT);
      doc.text("Resumo completo de diárias e adiantamentos",M+7,24);
      doc.setFontSize(8);doc.setTextColor(...GRAY);
      doc.text("Gerado: "+new Date().toLocaleDateString("pt-BR"),W-M,24,{align:"right"});
      y=40;

      // ── Cards resumo ──
      const cw=(W-M*2-8)/3;
      [[fm(totD),"Total em Diárias",SKY],[fm(totA),"Adiantamentos",YEL],[fm(saldo),"A Receber",saldo>0?MINT:YEL]].forEach((item,i)=>{
        const [val,lbl,cor]=item,x=M+i*(cw+4);
        doc.setFillColor(18,20,36);doc.roundedRect(x,y,cw,22,2,2,"F");
        doc.setFillColor(...cor);doc.rect(x,y,3,22,"F");
        doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(...GRAY);
        doc.text(lbl.toUpperCase(),x+6,y+8);
        doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(...WHITE);
        doc.text(val,x+6,y+17);
      });
      y+=30;

      // ── Resumo geral ──
      sec("RESUMO GERAL",PUR);
      const resumoRows=[
        ["Total em Diárias ("+diarias.filter(d=>d.status!=="cancelado").length+" dias)", fm(totD), WHITE],
        ["Diárias pagas ("+dPagas.length+")",  fm(totPago), MINT],
        ["Diárias pendentes ("+dPend.length+")", fm(totPend), YEL],
        ["Adiantamentos recebidos", fm(totA), SKY],
        ["Saldo a receber", fm(saldo), saldo>0?YEL:MINT],
      ];
      resumoRows.forEach((r,i)=>{
        chk(9);
        doc.setFillColor(i%2===0?14:11, i%2===0?16:14, i%2===0?30:24);
        doc.rect(M,y,W-M*2,8,"F");
        doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...GRAY);
        doc.text(r[0],M+4,y+5.5);
        doc.setFont("helvetica","bold");doc.setTextColor(...r[2]);
        doc.text(r[1],W-M,y+5.5,{align:"right"});
        y+=8;
      });
      y+=6;

      // ── Diárias pendentes ──
      if(dPend.length>0){
        sec("DIÁRIAS PENDENTES",[180,130,0]);
        const cp=[M,M+26,M+82,M+120,M+148,M+170];
        // cabeçalho tabela
        doc.setFillColor(18,20,36);doc.rect(M,y,W-M*2,7,"F");
        doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(...GRAY);
        ["Data","Evento","Tipo","Diária","Alim.","Total"].forEach((h,i)=>doc.text(h,cp[i],y+5));
        y+=8;
        // linhas
        dPend.slice().sort((a,b)=>ds(a.data).localeCompare(ds(b.data))).forEach((d,i)=>{
          chk(8);
          doc.setFillColor(i%2===0?14:11,i%2===0?16:14,i%2===0?30:24);
          doc.rect(M,y-1,W-M*2,7,"F");
          const tipo=((TIPOS.find(t=>t.tipo===d.tipoDiaria)||{}).label||"Rua").replace("Diária de ","");
          const alim=(Number(d.almoco)||0)+(Number(d.janta)||0);
          const tot=calcTotal(d);
          doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...WHITE);
          doc.text(fd(ds(d.data)),cp[0],y+4);
          doc.text((String(d.evento||d.desc||"-")).slice(0,20)+(d.dobra?" ⚡":""),cp[1],y+4);
          doc.text(tipo,cp[2],y+4);
          doc.text(fm(Number(d.valorDiaria)||0),cp[3],y+4);
          doc.setTextColor(167,139,250);
          doc.text(alim>0?fm(alim):"-",cp[4],y+4);
          doc.setTextColor(...YEL);
          doc.text(fm(tot),cp[5],y+4);
          y+=7;
        });
        y+=2;
        chk(10);
        doc.setFillColor(180,130,0);doc.rect(M,y,W-M*2,8,"F");
        doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...INK);
        doc.text("SUBTOTAL ("+dPend.length+" diárias)",M+4,y+5.5);
        doc.text(fm(totPend),W-M,y+5.5,{align:"right"});
        y+=14;
      }

      // ── Diárias pagas ──
      if(dPagas.length>0){
        sec("DIÁRIAS PAGAS",MINT);
        const cp=[M,M+26,M+82,M+120,M+148,M+170];
        doc.setFillColor(18,20,36);doc.rect(M,y,W-M*2,7,"F");
        doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(...GRAY);
        ["Data","Evento","Tipo","Diária","Alim.","Total"].forEach((h,i)=>doc.text(h,cp[i],y+5));
        y+=8;
        dPagas.slice().sort((a,b)=>ds(a.data).localeCompare(ds(b.data))).forEach((d,i)=>{
          chk(8);
          doc.setFillColor(i%2===0?14:11,i%2===0?16:14,i%2===0?30:24);
          doc.rect(M,y-1,W-M*2,7,"F");
          const tipo=((TIPOS.find(t=>t.tipo===d.tipoDiaria)||{}).label||"Rua").replace("Diária de ","");
          const alim=(Number(d.almoco)||0)+(Number(d.janta)||0);
          const tot=calcTotal(d);
          doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...GRAY);
          doc.text(fd(ds(d.data)),cp[0],y+4);
          doc.text((String(d.evento||d.desc||"-")).slice(0,20),cp[1],y+4);
          doc.text(tipo,cp[2],y+4);
          doc.text(fm(Number(d.valorDiaria)||0),cp[3],y+4);
          doc.setTextColor(167,139,250);
          doc.text(alim>0?fm(alim):"-",cp[4],y+4);
          doc.setTextColor(...MINT);
          doc.text(fm(tot),cp[5],y+4);
          y+=7;
        });
        y+=2;
        chk(10);
        doc.setFillColor(...MINT);doc.rect(M,y,W-M*2,8,"F");
        doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...INK);
        doc.text("SUBTOTAL ("+dPagas.length+" diárias)",M+4,y+5.5);
        doc.text(fm(totPago),W-M,y+5.5,{align:"right"});
        y+=14;
      }

      // ── Adiantamentos ──
      const adiantos=movimentos.filter(m=>m.tipo==="adiantamento");
      if(adiantos.length>0){
        chk(20);sec("ADIANTAMENTOS RECEBIDOS",SKY);
        const ma=[M,M+50,M+120];
        doc.setFillColor(18,20,36);doc.rect(M,y,W-M*2,7,"F");
        doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(...GRAY);
        ["Data","Observação","Valor"].forEach((h,i)=>doc.text(h,ma[i],y+5));
        y+=8;
        adiantos.slice().sort((a,b)=>ds(a.data).localeCompare(ds(b.data))).forEach((m,i)=>{
          chk(8);
          doc.setFillColor(i%2===0?14:11,i%2===0?16:14,i%2===0?30:24);
          doc.rect(M,y-1,W-M*2,7,"F");
          doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...WHITE);
          doc.text(fd(ds(m.data)),ma[0],y+4);
          doc.text(String(m.obs||"—").slice(0,34),ma[1],y+4);
          doc.setTextColor(...SKY);
          doc.text(fm(num(m.valor)),ma[2],y+4);
          y+=7;
        });
        y+=2;
        chk(10);
        doc.setFillColor(...SKY);doc.rect(M,y,W-M*2,8,"F");
        doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...INK);
        doc.text("TOTAL ADIANTADO",M+4,y+5.5);
        doc.text(fm(totA),W-M,y+5.5,{align:"right"});
        y+=14;
      }

      // ── Box saldo final ──
      chk(28);
      doc.setFillColor(saldo>0?6:40,saldo>0?40:35,saldo>0?20:8);
      doc.roundedRect(M,y,W-M*2,22,3,3,"F");
      doc.setFillColor(...(saldo>0?MINT:YEL));doc.rect(M,y,5,22,"F");
      doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(...WHITE);
      doc.text("VALOR FINAL A RECEBER",M+10,y+9);
      doc.setFontSize(16);doc.setTextColor(...(saldo>0?MINT:YEL));
      doc.text(fm(saldo),M+10,y+18);
      doc.setFontSize(8);doc.setTextColor(...GRAY);
      doc.text(diarias.length+" diárias  ·  "+fm(totA)+" adiantado  ·  total "+fm(totD),W-M,y+18,{align:"right"});

      // ── Rodapé todas as páginas ──
      const pages=doc.getNumberOfPages();
      for(let i=1;i<=pages;i++){
        doc.setPage(i);
        doc.setFillColor(...INK);doc.rect(0,288,W,9,"F");
        doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(...GRAY);
        doc.text("Fechamento · Relatório de Diárias",M,294);
        doc.text("Pág "+i+"/"+pages,W-M,294,{align:"right"});
      }

      const hoje2=new Date().toLocaleDateString("pt-BR").split("/").join("-");
      abrirBlob(doc,"fechamento_"+hoje2+".pdf");
    }

    // ── Importar PDF com IA ───────────────────────────────────────────────
    async function lerPDFcomIA(file,setLog){
      setLog("📖 Lendo o arquivo PDF...");
      const base64=await new Promise((res,rej)=>{
        const r=new FileReader();
        r.onload=()=>res(r.result.split(",")[1]);
        r.onerror=()=>rej(new Error("Erro ao ler arquivo"));
        r.readAsDataURL(file);
      });
      setLog("🤖 Analisando com IA...");
      const prompt=`Você é um extrator de dados de documentos. Analise este PDF e extraia TODAS as entradas que representem dias trabalhados, diárias, serviços prestados ou pagamentos.\n\nPara cada entrada encontrada, retorne um objeto JSON com estes campos exatos:\n- evento: nome do evento, cliente ou serviço (string)\n- data: data no formato YYYY-MM-DD (se não houver, use hoje)\n- tipoDiaria: "rua" se for serviço externo/campo/rua, "deposito" se for depósito/armazém/estoque\n- valorDiaria: valor numérico da diária (sem R$, apenas número)\n- almoco: valor numérico do almoço se mencionado (0 se não houver)\n- janta: valor numérico da janta se mencionado (0 se não houver)\n- obs: observação relevante (string vazia se não houver)\n\nRetorne APENAS um array JSON válido, sem texto adicional, sem markdown, sem explicações.\nExemplo: [{"evento":"Show do João","data":"2024-03-15","tipoDiaria":"rua","valorDiaria":200,"almoco":0,"janta":0,"obs":""}]\n\nSe não encontrar nenhuma entrada de diária, retorne um array vazio: []`;
      const response=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:2000,
          messages:[{role:"user",content:[
            {type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}},
            {type:"text",text:prompt}
          ]}]
        })
      });
      if(!response.ok)throw new Error("Erro na API: "+response.status);
      const data=await response.json();
      const texto=data.content.map(b=>b.text||"").join("").trim();
      const limpo=texto.replace(/```json|```/g,"").trim();
      return JSON.parse(limpo);
    }

    // ── App principal ─────────────────────────────────────────────────────
    function App(){
      // Firebase refs via window (bridge entre módulo e babel)
      const auth  = window.__firebaseAuth;
      const db    = window.__firebaseDb;
      const fns   = window.__firebaseFns;

      // Auth state
      const [usuario,    setUsuario]    = useState(null);
      const [authReady,  setAuthReady]  = useState(false);
      const [loginEmail, setLoginEmail] = useState("");
      const [loginSenha, setLoginSenha] = useState("");
      const [loginMsg,   setLoginMsg]   = useState("");
      const [loginLoad,  setLoginLoad]  = useState(false);

      // Dados
      const [diarias,    setDiarias]    = useState([]);
      const [movimentos, setMovimentos] = useState([]);
      const [carregando, setCarregando] = useState(false);

      // UI
      const [aba,       setAba]       = useState("diarias");
      const [tela,      setTela]      = useState("lista");
      const [editId,    setEditId]    = useState(null);
      const [filtroMes, setFiltroMes] = useState("");
      const [filtroSt,  setFiltroSt]  = useState("");
      const [busca,     setBusca]     = useState("");
      const [pdfMes,    setPdfMes]    = useState("");
      const [gerando,   setGerando]   = useState(false);
      const [gerandoF,  setGerandoF]  = useState(false);
      const [importLog, setImportLog] = useState("");
      const [importando,setImportando]= useState(false);
      const [toast,     setToast]     = useState(null);
      const [confirmId, setConfirmId] = useState(null);
      const [drawer,    setDrawer]    = useState(false);

      const [form, setForm] = useState({data:hoje(),evento:"",tipoDiaria:"",valorDiaria:"",dobra:false,almoco:"",janta:"",obs:""});
      const [diasSel, setDiasSel] = useState([]);
      const [calMes,  setCalMes]  = useState(()=>hoje().slice(0,7));
      const [mForm,setMForm]= useState({valor:"",data:hoje(),obs:""});
      const [mErro,setMErro]= useState("");

      // ── Firebase helpers ──────────────────────────────────────────────
      function colDiarias(uid){ return fns.collection(db,"users",uid,"lancamentos"); }
      function colMovimentos(uid){ return fns.collection(db,"users",uid,"movimentos"); }

      async function carregarDados(uid){
        setCarregando(true);
        try{
          // Normaliza qualquer formato de data para "YYYY-MM-DD"
          function normalizarData(val) {
            if (!val) return "";
            // Firestore Timestamp
            if (val && typeof val === "object" && typeof val.toDate === "function") {
              return val.toDate().toISOString().slice(0, 10);
            }
            // Já é string ISO "YYYY-MM-DD" ou "YYYY-MM-DDTHH..."
            if (typeof val === "string") return val.slice(0, 10);
            // Number (ms)
            if (typeof val === "number") return new Date(val).toISOString().slice(0, 10);
            return "";
          }

          // Diárias
          const qD=fns.query(colDiarias(uid),fns.orderBy("data","desc"));
          const snapD=await fns.getDocs(qD);
          const listD=snapD.docs.map(s=>{
            const d=s.data();
            return {
              id: s.id,
              data: normalizarData(d.data),
              evento: d.desc||d.evento||"",
              tipoDiaria: d.tipo||d.tipoDiaria||"rua",
              valorDiaria: d.valor||d.valorDiaria||0,
              dobra: d.calc==="dobra"||d.dobra||false,
              almoco: d.almoco||0,
              janta: d.janta||0,
              obs: d.obs||"",
              status: d.status||"pendente",
              categoria: d.categoria||"diaria",
            };
          }).filter(d=>d.categoria==="diaria"||!d.categoria);

          // Movimentos (adiantamentos antigos ficavam em lancamentos com categoria="adiantamento")
          const listMov=snapD.docs.map(s=>{
            const d=s.data();
            if(d.categoria!=="adiantamento") return null;
            return {id:s.id,tipo:"adiantamento",data:normalizarData(d.data),valor:d.valor||0,obs:d.desc||d.obs||""};
          }).filter(Boolean);

          // Movimentos na nova coleção separada
          try{
            const qM=fns.query(colMovimentos(uid),fns.orderBy("data","desc"));
            const snapM=await fns.getDocs(qM);
            snapM.docs.forEach(s=>listMov.push({id:s.id,...s.data()}));
          }catch(e){ /* coleção pode não existir ainda */ }

          console.log('DIÁRIAS CARREGADAS:', listD.map(d=>({id:d.id,status:d.status,evento:d.evento,data:d.data})));
          setDiarias(listD);
          setMovimentos(listMov);
        }finally{
          setCarregando(false);
        }
      }

      useEffect(()=>{
        if(!auth||!fns) return;
        const unsub=fns.onAuthStateChanged(auth,user=>{
          setUsuario(user||null);
          setAuthReady(true);
          if(user) carregarDados(user.uid);
          else{ setDiarias([]); setMovimentos([]); }
        });
        return ()=>unsub();
      },[]);

      // ── CRUD Diárias ──────────────────────────────────────────────────
      async function salvarDiaria(){
        if(!form.evento||!form.tipoDiaria){showToast("Preencha Evento e Tipo.","#F87171");return;}
        const valor=Number(form.valorDiaria)||0;
        if(valor<=0){showToast("Informe o valor da diária.","#F87171");return;}
        const base={
          evento: form.evento,
          tipoDiaria: form.tipoDiaria,
          valorDiaria: valor,
          dobra: form.dobra||false,
          almoco: Number(form.almoco)||0,
          janta: Number(form.janta)||0,
          obs: form.obs||"",
          status: "pendente",
          categoria: "diaria",
        };
        if(editId){
          const item=diarias.find(d=>d.id===editId);
          await fns.updateDoc(fns.doc(db,"users",usuario.uid,"lancamentos",editId),{...base,data:form.data,status:item?.status||"pendente"});
          showToast("Diária atualizada");
        } else {
          // múltiplos dias selecionados
          const dias = diasSel.length>0 ? diasSel : [form.data];
          for(const dia of dias){
            await fns.addDoc(colDiarias(usuario.uid),{...base,data:dia});
          }
          showToast(dias.length>1?dias.length+" diárias registradas!":"Diária registrada");
        }
        setTela("lista");setEditId(null);
        resetForm();
        await carregarDados(usuario.uid);
      }

      async function marcarPago(id){
        await fns.updateDoc(fns.doc(db,"users",usuario.uid,"lancamentos",id),{status:"pago"});
        setDiarias(d=>d.map(x=>x.id===id?{...x,status:"pago"}:x));
        showToast("Marcada como paga");
      }

      async function voltarPendente(id){
        await fns.updateDoc(fns.doc(db,"users",usuario.uid,"lancamentos",id),{status:"pendente"});
        setDiarias(d=>d.map(x=>x.id===id?{...x,status:"pendente"}:x));
        showToast("Voltou para pendente","#FACC15");
      }

      async function excluirDiaria(id){
        await fns.deleteDoc(fns.doc(db,"users",usuario.uid,"lancamentos",id));
        setDiarias(d=>d.filter(x=>x.id!==id));
        setConfirmId(null);
        if(tela==="form")setTela("lista");
        showToast("Diária removida","#F87171");
      }

      // ── CRUD Movimentos ───────────────────────────────────────────────
      async function salvarMov(){
        const v=num(mForm.valor);
        if(!v||v<=0){setMErro("Informe um valor válido.");return;}
        try{
          const payload={categoria:"adiantamento",tipo:"adiantamento",valor:v,data:mForm.data,obs:mForm.obs||"",desc:mForm.obs||""};
          await fns.addDoc(colDiarias(usuario.uid),payload);
          setMForm(f=>({...f,valor:"",obs:""}));setMErro("");
          showToast("Adiantamento registrado");
          await carregarDados(usuario.uid);
        }catch(err){
          setMErro("Erro ao salvar: "+err.message);
        }
      }

      async function excluirMov(id){
        try{
          await fns.deleteDoc(fns.doc(db,"users",usuario.uid,"lancamentos",id));
        }catch(e){
          try{await fns.deleteDoc(fns.doc(db,"users",usuario.uid,"movimentos",id));}catch{}
        }
        setMovimentos(m=>m.filter(x=>x.id!==id));
        showToast("Removido","#F87171");
      }

      // ── Auth ──────────────────────────────────────────────────────────
      async function entrar(){
        if(!loginEmail||!loginSenha){setLoginMsg("Preencha e-mail e senha.");return;}
        setLoginLoad(true);setLoginMsg("");
        try{ await fns.signInWithEmailAndPassword(auth,loginEmail,loginSenha); }
        catch(e){ setLoginMsg(traduzirErro(e)); }
        finally{ setLoginLoad(false); }
      }

      async function cadastrar(){
        if(!loginEmail||!loginSenha){setLoginMsg("Preencha e-mail e senha.");return;}
        setLoginLoad(true);setLoginMsg("");
        try{ await fns.createUserWithEmailAndPassword(auth,loginEmail,loginSenha); }
        catch(e){ setLoginMsg(traduzirErro(e)); }
        finally{ setLoginLoad(false); }
      }

      function traduzirErro(e){
        const m=e.message||e.code||"";
        if(m.includes("user-not-found")||m.includes("invalid-credential"))return "E-mail ou senha incorretos.";
        if(m.includes("email-already-in-use"))return "E-mail já cadastrado.";
        if(m.includes("weak-password"))return "Senha fraca (mín. 6 caracteres).";
        if(m.includes("invalid-email"))return "E-mail inválido.";
        return "Erro: "+m;
      }

      // ── Importar PDF ──────────────────────────────────────────────────
      async function handleImportFile(e){
        const file=e.target.files?.[0];
        if(!file)return;
        const isPDF=file.name.toLowerCase().endsWith(".pdf")||file.type==="application/pdf";
        if(!isPDF){showToast("Selecione um PDF.","#F87171");return;}
        setImportando(true);setImportLog("");
        try{
          const itens=await lerPDFcomIA(file,setImportLog);
          if(!itens||itens.length===0){setImportLog("⚠️ Nenhuma diária encontrada.");setImportando(false);return;}
          setImportLog("✅ "+itens.length+" diária(s) encontrada(s)! Salvando...");
          for(const item of itens){
            await fns.addDoc(colDiarias(usuario.uid),{
              data:item.data||hoje(), evento:item.evento||"Importado",
              tipoDiaria:item.tipoDiaria||"rua", valorDiaria:Number(item.valorDiaria)||0,
              dobra:false, almoco:Number(item.almoco)||0, janta:Number(item.janta)||0,
              obs:item.obs||"Importado via PDF", status:"pendente", categoria:"diaria",
            });
          }
          await carregarDados(usuario.uid);
          setTimeout(()=>{setTela("lista");setImportLog("");showToast(itens.length+" diária(s) importada(s)!");},1000);
        }catch(err){setImportLog("❌ Erro: "+err.message);}
        finally{setImportando(false);e.target.value="";}
      }

      // ── UI helpers ────────────────────────────────────────────────────
      function showToast(msg,cor="#22D3EE"){setToast({msg,cor});setTimeout(()=>setToast(null),2400);}
      function resetForm(){ setForm({data:hoje(),evento:"",tipoDiaria:"",valorDiaria:"",dobra:false,almoco:"",janta:"",obs:""}); setDiasSel([]); setCalMes(hoje().slice(0,7)); }
      function abrirForm(d=null){
        if(d){ setDiasSel([]); setCalMes((d.data||hoje()).slice(0,7)); setForm({data:d.data,evento:d.evento||"",tipoDiaria:d.tipoDiaria||"",valorDiaria:d.valorDiaria||"",dobra:d.dobra||false,almoco:d.almoco||"",janta:d.janta||"",obs:d.obs||""}); setEditId(d.id); }
        else{ resetForm(); setEditId(null); }

      // ── Cálculos ──────────────────────────────────────────────────────
      const nst2=s=>String(s||'pendente').toLowerCase().trim();

      const totP=diarias.filter(d=>nst2(d.status)==="pendente").reduce((s,d)=>s+calcTotal(d),0);

      const meses=[...new Set(diarias.map(d=>d.data?.slice(0,7)))].filter(Boolean).sort().reverse();

      // ── Estilos ────────────────────────────────────────────────────────

              <div style={{fontSize:11,fontWeight:700,color:"#F87171",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Confirmar exclusão</div>
              <div style={{fontSize:17,fontWeight:600,color:txt,marginBottom:4}}>{d?.evento}</div>
              <div style={{fontSize:13,color:muted,marginBottom:24}}>{fd(d?.data)} · {fm(calcTotal(d||{}))}</div>

                <button className="press" style={{flex:1,padding:"13px",background:"rgba(248,113,113,.1)",border:"1px solid rgba(248,113,113,.2)",borderRadius:12,color:"#F87171",fontWeight:700,fontSize:14}} onClick={()=>excluirDiaria(confirmId)}>Excluir</button>

            <div style={{width:60,height:60,background:"linear-gradient(135deg,#0EA5E9,#0284C7)",borderRadius:18,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,marginBottom:18,boxShadow:"0 8px 28px rgba(14,165,233,.35)"}}>💼</div>
            <div style={{fontSize:26,fontWeight:800,color:txt,letterSpacing:"-.04em",marginBottom:6}}>Controle de Diárias</div>
            <div style={{fontSize:13,color:muted,marginBottom:24,lineHeight:1.5}}>Entre com seu e-mail para acessar suas diárias salvas na nuvem.</div>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div>
                <label style={lbl}>E-mail</label>
                <input style={inp} type="email" placeholder="seu@email.com" value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()}/>
              </div>
              <div>
                <label style={lbl}>Senha</label>
                <input style={inp} type="password" placeholder="••••••" value={loginSenha} onChange={e=>setLoginSenha(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()}/>
              </div>
              {loginMsg&&<div style={{fontSize:13,color:"#F87171",background:"rgba(248,113,113,.08)",border:"1px solid rgba(248,113,113,.18)",borderRadius:10,padding:"10px 14px",fontWeight:500}}>{loginMsg}</div>}
              <BtnPrimary onClick={entrar} disabled={loginLoad} style={{width:"100%",marginTop:4}}>
                {loginLoad?"Entrando…":"Entrar"}
              </BtnPrimary>
              <button className="press" onClick={cadastrar} disabled={loginLoad}
                style={{width:"100%",padding:"13px",background:"rgba(14,165,233,.07)",border:"1px solid rgba(14,165,233,.15)",borderRadius:12,color:acent2,fontWeight:600,fontSize:14}}>
                Criar conta
              </button>
            </div>
          </div>
        </div>
      );

      // ── TELA IMPORTAR ──────────────────────────────────────────────────
      if(tela==="importar") return(
        <div style={{minHeight:"100vh",background:"#040D1A",color:txt,maxWidth:520,margin:"0 auto"}}>
          <div style={HDR}>
            <button className="press" onClick={()=>{setTela("lista");setImportLog("");}} style={{background:"transparent",border:"1px solid rgba(14,165,233,.12)",color:muted,fontSize:13,fontWeight:500,padding:"8px 16px",borderRadius:20}}>← Voltar</button>
            <span style={{fontSize:16,fontWeight:700}}>Importar PDF</span>

              <div style={{fontSize:20,fontWeight:800,color:txt,letterSpacing:"-.04em"}}>Importar diárias</div>
              <div style={{color:muted,fontSize:13,marginTop:6,lineHeight:1.6}}>Envie um PDF com diárias, planilhas ou extratos e a IA extrai os dados automaticamente.</div>
            </div>
            <div style={{...card,padding:18}}>
              <label style={{...lbl,marginBottom:12}}>Selecionar arquivo PDF</label>
              <label style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,padding:"28px 20px",background:"rgba(14,165,233,.04)",border:"2px dashed rgba(14,165,233,.2)",borderRadius:12,cursor:"pointer",textAlign:"center"}}>
                <span style={{fontSize:36}}>📄</span>

                const [calAno, calMesNum] = calMes.split("-").map(Number);

                const diasNoMes   = new Date(calAno, calMesNum, 0).getDate();

                for(let i=0;i<primeiroDia;i++) cells.push(null);

                    <div style={{...inp,color:acent2,fontWeight:600,background:"rgba(14,165,233,.06)",border:"1px solid rgba(14,165,233,.15)"}}>
                      {form.data?new Date(form.data+"T12:00").toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","").replace(/^\w/,c=>c.toUpperCase()):"—"}
                    </div>
                  </div>
                </div>
              )}
              <div>
                <label style={lbl}>Evento *</label>

                <div key={c.tipo} style={{...card,padding:"12px",display:"flex",flexDirection:"column",alignItems:"center",gap:4,textAlign:"center"}}>

                  <div style={{fontSize:10,fontWeight:600,color:muted,textTransform:"uppercase",letterSpacing:"1px"}}>{c.tipo==="personalizada"?"Custom":c.tipo==="rua"?"Rua":"Depósito"}</div>
                  <div style={{fontSize:16,fontWeight:800,color:acent2}}>{n}</div>
                  <div style={{fontSize:10,color:muted}}>{fm(v)}</div>
                </div>

            {carregando?(

                            onClick={e=>{e.stopPropagation();nst2(d.status)==="pendente"?marcarPago(d.id):voltarPendente(d.id);}}

              </div>
              <div style={{background:"rgba(56,189,248,.08)",border:"1px solid rgba(56,189,248,.18)",borderRadius:10,padding:"12px 14px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:12,color:muted,fontWeight:500}}>Ainda a receber</span>
                <span style={{fontSize:17,fontWeight:800,color:saldo>0?"#FACC15":saldo<0?"#F87171":"#22D3EE"}}>{saldo<0?"- "+fm(Math.abs(saldo)):fm(saldo)}</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
                <div><label style={lbl}>Data</label><input type="date" style={inp} value={mForm.data} onChange={e=>setMForm(f=>({...f,data:e.target.value}))}/></div>
                <div><label style={lbl}>Valor (R$)</label><input type="number" style={{...inp,fontWeight:800,fontSize:17,color:"#38BDF8"}} placeholder="0,00" value={mForm.valor} onChange={e=>{setMErro("");setMForm(f=>({...f,valor:e.target.value}));}}/></div>
              </div>
              <div style={{marginBottom:16}}>
                <label style={lbl}>Observação</label>
                <input style={inp} placeholder="Pix, dinheiro em mãos…" value={mForm.obs} onChange={e=>setMForm(f=>({...f,obs:e.target.value}))}/>
              </div>
              {mErro&&<div style={{color:"#F87171",fontSize:13,padding:"10px 14px",background:"rgba(248,113,113,.08)",border:"1px solid rgba(248,113,113,.18)",borderRadius:10,marginBottom:14,fontWeight:500}}>{mErro}</div>}
              <button className="press" style={{width:"100%",padding:14,background:"linear-gradient(135deg,#0C4A6E,#0369A1)",border:"none",borderRadius:12,color:"#fff",fontWeight:700,fontSize:14,boxShadow:"0 4px 18px rgba(56,189,248,.2)"}} onClick={salvarMov}>
                Registrar Adiantamento
              </button>
            </div>
            <div style={{padding:"18px 20px"}}>
              <div style={{fontSize:11,fontWeight:700,color:muted,textTransform:"uppercase",letterSpacing:"1px",marginBottom:12}}>Histórico de Adiantamentos</div>
              {movs.length===0?(
                <div style={{textAlign:"center",padding:"32px 0",color:"#0D2440",fontSize:13,fontWeight:500}}>Nenhum adiantamento ainda</div>
              ):movs.map(m=>(
                <div key={m.id} style={{...card,marginBottom:10,overflow:"hidden"}}>
                  <div style={{padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:700,color:"#38BDF8",marginBottom:4}}>💵 Adiantamento</div>
                      <div style={{fontSize:12,color:muted}}>{fd(m.data)}{m.obs?<span style={{color:"#252A3A"}}> · {m.obs}</span>:null}</div>
                    </div>
                    <div style={{fontSize:17,fontWeight:800,color:"#22D3EE"}}>{fm(m.valor)}</div>
                  </div>
                  <div style={{borderTop:"1px solid rgba(14,165,233,.07)"}}>
                    <button className="press" onClick={()=>excluirMov(m.id)} style={{width:"100%",background:"rgba(248,113,113,.04)",border:"none",color:"#F87171",padding:"9px",fontWeight:600,fontSize:12}}>
                      🗑 Excluir
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      // ── ABA FECHAMENTO ─────────────────────────────────────────────────
      const renderFechamento=()=>{
        const nst3=s=>String(s||'pendente').toLowerCase().trim();
        const dPagas=diarias.filter(d=>nst3(d.status)==="pago");
        const dPend=diarias.filter(d=>nst3(d.status)==="pendente");
        const totAlim=diarias.reduce((s,d)=>s+(d.almoco||0)+(d.janta||0),0);
        const totPend2=dPend.reduce((s,d)=>s+calcTotal(d),0);
        const totPago2=dPagas.reduce((s,d)=>s+calcTotal(d),0);
        return(
          <div style={{paddingBottom:100}} className="fadein">
            <div style={{margin:"20px 20px 0",borderRadius:20,overflow:"hidden",position:"relative",background:"linear-gradient(145deg,#040D1A,#071E38)",border:"1px solid rgba(34,211,238,.2)"}}>
              <div style={{padding:"22px 22px 18px",position:"relative"}}>
                <div style={{fontSize:11,fontWeight:600,color:"rgba(34,211,238,.5)",textTransform:"uppercase",letterSpacing:"1.2px",marginBottom:8}}>A Receber</div>
                <div style={{fontSize:36,fontWeight:800,color:saldo>0?"#22D3EE":"#FACC15",letterSpacing:"-.04em",lineHeight:1}}>{fm(saldo)}</div>
                <div style={{fontSize:12,color:muted,marginTop:6}}>Após descontar {fm(totA)} em adiantamentos</div>
                <button className="press" onClick={async()=>{setGerandoF(true);try{await exportPDFFechamento(diarias,movimentos);}catch(e){alert("Erro: "+e.message);}finally{setGerandoF(false);}}} disabled={gerandoF}
                  style={{marginTop:16,width:"100%",background:"linear-gradient(135deg,#064E3B,#047857)",border:"1px solid rgba(34,211,238,.25)",borderRadius:10,color:"#22D3EE",padding:"13px",fontWeight:700,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",gap:8,opacity:gerandoF?.6:1,boxShadow:"0 4px 16px rgba(34,211,238,.15)"}}>
                  {gerandoF?"⏳ Gerando PDF…":"📄 Exportar Fechamento em PDF"}
                </button>
              </div>
            </div>

            <div style={{padding:"14px 20px 0"}}>
              <div style={{fontSize:11,fontWeight:700,color:muted,textTransform:"uppercase",letterSpacing:"1px",marginBottom:10}}>Resumo Geral</div>
              <div style={{...card,overflow:"hidden"}}>
                {[
                  {l:"Total em Diárias",v:fm(totD),c:txt,icon:"📋"},
                  {l:"Alimentação inclusa",v:fm(totAlim),c:acent2,icon:"🍽"},
                  {l:"Adiantamentos recebidos",v:fm(totA),c:"#38BDF8",icon:"💵"},
                  {l:"Diárias já pagas ("+dPagas.length+")",v:fm(totPago2),c:"#22D3EE",icon:"✅"},
                  {l:"Diárias pendentes ("+dPend.length+")",v:fm(totPend2),c:"#FACC15",icon:"⏳"},
                ].map(({l,v,c,icon},i,arr)=>(
                  <div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"13px 16px",borderBottom:i<arr.length-1?"1px solid rgba(14,165,233,.07)":"none"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:15}}>{icon}</span>
                      <span style={{fontSize:13,color:muted,fontWeight:500}}>{l}</span>
                    </div>
                    <span style={{fontSize:13,fontWeight:700,color:c}}>{v}</span>
                  </div>
                ))}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",background:"rgba(34,211,238,.06)",borderTop:"1px solid rgba(34,211,238,.12)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:15}}>💰</span>
                    <span style={{fontSize:14,fontWeight:700,color:txt}}>Saldo a Receber</span>
                  </div>
                  <span style={{fontSize:17,fontWeight:800,color:saldo>0?"#22D3EE":saldo<0?"#F87171":"#22D3EE"}}>{saldo<0?"- "+fm(Math.abs(saldo)):fm(saldo)}</span>
                </div>
              </div>
            </div>

            {dPend.length>0&&(
              <div style={{padding:"16px 20px 0"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#FACC15",textTransform:"uppercase",letterSpacing:"1px",marginBottom:10}}>⏳ Diárias Pendentes</div>
                {dPend.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(d=>{
                  const ti=TIPOS.find(t=>t.tipo===d.tipoDiaria);
                  return(
                    <div key={d.id} style={{...card,marginBottom:8,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div>
                        <div style={{fontSize:13,fontWeight:700,color:txt,marginBottom:3}}>{d.evento}{d.dobra?<span style={{color:acent2,fontSize:11}}> ⚡</span>:null}</div>
                        <div style={{fontSize:11,color:muted}}>{fd(d.data)}{ti?" · "+ti.emoji+" "+ti.label:""}</div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:15,fontWeight:800,color:"#FACC15"}}>{fm(calcTotal(d))}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {totA>0&&(
              <div style={{padding:"16px 20px 0"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#38BDF8",textTransform:"uppercase",letterSpacing:"1px",marginBottom:10}}>💵 Adiantamentos Recebidos</div>
                {[...movimentos].sort((a,b)=>b.data.localeCompare(a.data)).map(m=>(
                  <div key={m.id} style={{...card,marginBottom:8,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:600,color:"#38BDF8",marginBottom:3}}>💵 Adiantamento</div>
                      <div style={{fontSize:11,color:muted}}>{fd(m.data)}{m.obs?" · "+m.obs:""}</div>
                    </div>
                    <div style={{fontSize:15,fontWeight:800,color:"#22D3EE"}}>{fm(m.valor)}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      };

      // ── LAYOUT PRINCIPAL ───────────────────────────────────────────────
      return(
        <div style={{minHeight:"100vh",background:"#040D1A",color:txt,maxWidth:520,margin:"0 auto"}}>
          {/* Header */}
          <div style={HDR}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <button className="press" onClick={()=>setDrawer(true)}
                style={{width:40,height:40,background:"rgba(14,165,233,.07)",border:"1px solid rgba(14,165,233,.15)",borderRadius:11,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:5,cursor:"pointer",flexShrink:0}}>
                <div style={{width:18,height:2,background:"#38BDF8",borderRadius:2}}/>
                <div style={{width:14,height:2,background:"#38BDF8",borderRadius:2}}/>
                <div style={{width:18,height:2,background:"#38BDF8",borderRadius:2}}/>
              </button>
              <div>
                <div style={{fontSize:18,fontWeight:800,color:txt,letterSpacing:"-.04em"}}>
                  {aba==="diarias"?"Diárias":aba==="adiantamento"?"Adiantamento":"Fechamento"}
                </div>
                <div style={{fontSize:11,color:muted,marginTop:1,fontWeight:500}}>
                  {aba==="diarias"?"Dias trabalhados":aba==="adiantamento"?"Recebimentos parciais":"Resumo completo"}
                </div>
              </div>
            </div>
            {aba==="diarias"&&(
              <button className="press" onClick={()=>abrirForm()}
                style={{background:"linear-gradient(135deg,#0EA5E9,#0284C7)",border:"none",borderRadius:11,color:"#fff",fontWeight:700,fontSize:13,padding:"10px 16px",boxShadow:"0 4px 16px rgba(14,165,233,.35)"}}>
                + Nova
              </button>
            )}
          </div>

          {/* Drawer overlay */}
          {drawer&&(
            <div onClick={()=>setDrawer(false)}
              style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:40,backdropFilter:"blur(4px)"}}/>
          )}

          {/* Drawer lateral */}
          <div style={{position:"fixed",top:0,left:0,height:"100%",width:280,background:"#040D1A",borderRight:"1px solid rgba(14,165,233,.12)",zIndex:50,transform:drawer?"translateX(0)":"translateX(-100%)",transition:"transform .28s cubic-bezier(.4,0,.2,1)",display:"flex",flexDirection:"column",paddingTop:"env(safe-area-inset-top)"}}>
            {/* Drawer header */}
            <div style={{padding:"22px 20px 16px",borderBottom:"1px solid rgba(14,165,233,.08)"}}>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:4}}>
                <div style={{width:40,height:40,background:"linear-gradient(135deg,#0EA5E9,#0284C7)",borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>💼</div>
                <div>
                  <div style={{fontSize:15,fontWeight:800,color:txt,letterSpacing:"-.03em"}}>Controle</div>
                  <div style={{fontSize:11,color:muted,marginTop:1}}>{usuario?.email||""}</div>
                </div>
              </div>
            </div>

            {/* Itens do menu */}
            <div style={{flex:1,padding:"12px 12px",display:"flex",flexDirection:"column",gap:4}}>
              {[
                {id:"diarias",    icon:"📋", label:"Diárias",      sub:"Dias trabalhados"},
                {id:"adiantamento",icon:"💵",label:"Adiantamento",  sub:"Recebimentos parciais"},
                {id:"fechamento", icon:"🔒", label:"Fechamento",    sub:"Resumo completo"},
              ].map(t=>{
                const on=aba===t.id;
                return(
                  <button key={t.id} className="press" onClick={()=>{setAba(t.id);setDrawer(false);}}
                    style={{display:"flex",alignItems:"center",gap:14,padding:"13px 14px",borderRadius:14,border:"none",cursor:"pointer",background:on?"rgba(14,165,233,.12)":"transparent",textAlign:"left",width:"100%"}}>
                    <div style={{width:38,height:38,background:on?"rgba(14,165,233,.2)":"rgba(14,165,233,.06)",border:"1px solid "+(on?"rgba(14,165,233,.35)":"rgba(14,165,233,.1)"),borderRadius:11,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>{t.icon}</div>
                    <div>
                      <div style={{fontSize:14,fontWeight:on?700:500,color:on?txt:muted}}>{t.label}</div>
                      <div style={{fontSize:11,color:on?"rgba(56,189,248,.6)":muted,marginTop:1,opacity:.7}}>{t.sub}</div>
                    </div>
                    {on&&<div style={{marginLeft:"auto",width:6,height:6,borderRadius:"50%",background:"#38BDF8",flexShrink:0}}/>}
                  </button>
                );
              })}

              <div style={{height:1,background:"rgba(14,165,233,.08)",margin:"8px 0"}}/>

              <button className="press" onClick={()=>{setTela("pdf");setDrawer(false);}}
                style={{display:"flex",alignItems:"center",gap:14,padding:"13px 14px",borderRadius:14,border:"none",cursor:"pointer",background:"transparent",textAlign:"left",width:"100%"}}>
                <div style={{width:38,height:38,background:"rgba(14,165,233,.06)",border:"1px solid rgba(14,165,233,.1)",borderRadius:11,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>📊</div>
                <div>
                  <div style={{fontSize:14,fontWeight:500,color:muted}}>Exportar PDF</div>
                  <div style={{fontSize:11,color:muted,marginTop:1,opacity:.7}}>Relatório de diárias</div>
                </div>
              </button>

              <button className="press" onClick={()=>{setTela("importar");setDrawer(false);}}
                style={{display:"flex",alignItems:"center",gap:14,padding:"13px 14px",borderRadius:14,border:"none",cursor:"pointer",background:"transparent",textAlign:"left",width:"100%"}}>
                <div style={{width:38,height:38,background:"rgba(14,165,233,.06)",border:"1px solid rgba(14,165,233,.1)",borderRadius:11,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>📥</div>
                <div>
                  <div style={{fontSize:14,fontWeight:500,color:muted}}>Importar PDF</div>
                  <div style={{fontSize:11,color:muted,marginTop:1,opacity:.7}}>Extrair diárias com IA</div>
                </div>
              </button>
            </div>

            {/* Sair */}
            <div style={{padding:"16px 12px",borderTop:"1px solid rgba(14,165,233,.08)",paddingBottom:"calc(16px + env(safe-area-inset-bottom))"}}>
              <button className="press" onClick={()=>{fns.signOut(auth);setDrawer(false);}}
                style={{display:"flex",alignItems:"center",gap:14,padding:"13px 14px",borderRadius:14,border:"none",cursor:"pointer",background:"rgba(248,113,113,.06)",textAlign:"left",width:"100%"}}>
                <div style={{width:38,height:38,background:"rgba(248,113,113,.08)",border:"1px solid rgba(248,113,113,.12)",borderRadius:11,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>🚪</div>
                <div style={{fontSize:14,fontWeight:600,color:"#F87171"}}>Sair da conta</div>
              </button>
            </div>
          </div>

          {/* Conteúdo */}
          {aba==="diarias"      && renderDiarias()}
          {aba==="adiantamento" && renderAdiant()}
          {aba==="fechamento"   && renderFechamento()}

          {/* FAB */}
          {aba==="diarias"&&(
            <button className="press" onClick={()=>abrirForm()}
              style={{position:"fixed",bottom:24,right:"max(20px, calc(50vw - 240px))",zIndex:30,width:58,height:58,borderRadius:"50%",border:"none",cursor:"pointer",background:"linear-gradient(135deg,#0EA5E9,#0284C7)",boxShadow:"0 6px 28px rgba(14,165,233,.55)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,color:"#fff",fontWeight:700}}>
              +
            </button>
          )}

          {/* Toast */}
          {toast&&(
            <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#071628",border:"1px solid "+toast.cor+"30",color:toast.cor,padding:"10px 20px",borderRadius:50,fontSize:13,fontWeight:600,boxShadow:"0 8px 32px rgba(0,0,0,.6)",zIndex:100,whiteSpace:"nowrap",backdropFilter:"blur(12px)"}}>
              {toast.msg}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
